<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Task Manager</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        form { margin: 20px 0; }
        ul { list-style-type: none; padding: 0; }
        li { padding: 8px; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
<div class="header">
    <h1>My Tasks</h1>

    <div>
        <span>Welcome, <strong th:text="${username}"></strong>!</span>
        <form th:action="@{/logout}" method="post" style="display: inline; margin-left: 15px;">
            <button type="submit">Logout</button>
        </form>
    </div>
</div>

<form th:action="@{/add}" method="post">
    <input type="text" name="title" placeholder="Task title" required />
    <input type="text" name="description" placeholder="Description" />
    <button type="submit">Add Task</button>
</form>

<h2>Task List</h2>
<ul>
    <li th:each="task : ${tasks}">
        <strong th:text="${task.title}"></strong> —
        <span th:text="${task.description}"></span>
        <span th:if="${task.completed}" style="color:green;"> ✅ Done</span>
    </li>
</ul>

<p><a href="/h2-console" target="_blank">🔗 Open H2 Database Console</a></p>
</body>
</html>
